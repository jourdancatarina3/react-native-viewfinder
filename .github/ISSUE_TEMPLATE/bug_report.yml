name: 🐛 Bug report
description: Report a reproducible bug or regression in this library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        👋 Hi!

        **Please fill the following carefully before opening a new issue ❗**
        *(Your issue may be closed if it doesn't provide the required pieces of information)*
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform simple checks first.
      options:
        - label: I tested using the latest version of the library, as the bug might be already fixed.
          required: true
        - label: I tested using a [supported version](https://github.com/reactwg/react-native-releases/blob/main/docs/support.md) of react native.
          required: true
        - label: I checked for possible duplicate issues, with possible answers.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Provide a clear and concise description of what the bug is.
        If needed, you can also provide other samples: error messages / stack traces, screenshots, gifs, etc.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: What version of the library are you using?
      placeholder: "x.x.x"
    validations:
      required: true
  - type: input
    id: gesture-handler-version
    attributes:
      label: react-native-gesture-handler version
      description: |
        This library supports both v2 and v3, and takes a different code path
        for each — so which one you have is usually the first thing to check.
      placeholder: "2.32.0"
    validations:
      required: true
  - type: dropdown
    id: gesture-api
    attributes:
      label: Which gesture API is active?
      description: |
        Log this in your app and paste the result:
        ```tsx
        import { HAS_HOOK_GESTURE_API } from 'react-native-viewfinder';
        console.log(HAS_HOOK_GESTURE_API);
        ```
      options:
        - "false — Gesture Handler v2 builder API"
        - "true — Gesture Handler v3 hook API"
        - "Not sure / the app does not start"
    validations:
      required: true
  - type: input
    id: reanimated-version
    attributes:
      label: react-native-reanimated version
      placeholder: "4.5.1"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: React Native architecture
      description: "`newArchEnabled` in app.json, or newArchEnabled in gradle.properties."
      options:
        - "New architecture (Fabric)"
        - "Old architecture"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms affected
      options:
        - label: iOS
        - label: Android
        - label: Only on a physical device (not in the simulator/emulator)
  - type: textarea
    id: react-native-info
    attributes:
      label: Environment info
      description: Run `npx react-native info` in your terminal and paste the results here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        You must provide a clear list of steps and code to reproduce the problem.
      value: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository 
      description: Please provide a link to a repository on GitHub with a reproducible example.
    validations:
      required: true
